name: Test, build and push to Alibaba Cloud ACR

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Image location is not secret; only the ACR login is stored in GitHub secrets.
  # Public endpoint: GitHub-hosted runners push over the internet. INSTANT pulls via the -vpc endpoint.
  ACR_REGISTRY: crpi-y6a776c9l4k3agmh.cn-hongkong.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-y6a776c9l4k3agmh.cn-hongkong.personal.cr.aliyuncs.com/kawaru/sxo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt -r image/requirements.txt
      - name: Test API payload, benchmarks and archive failures
        run: python -m unittest discover -s tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and load image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ehpc-instant-benchmark:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify CPU inventory and FIO inside the image
        run: |
          docker run --rm ehpc-instant-benchmark:ci python /app/run_instant_job.py --help
          docker run --rm -i --entrypoint python ehpc-instant-benchmark:ci - <<'EOF'
          import tempfile
          from pathlib import Path
          from benchmark import cpu_inventory, fio_benchmark, summarize
          cpu = cpu_inventory()
          print("\n".join(summarize("cpu", cpu)))
          assert cpu["pass"] and cpu["summary"].get("model"), cpu
          settings = {"disk_dir": "/tmp/ci-fio", "fio_size_mib": 16, "fio_runtime_seconds": 1}
          with tempfile.TemporaryDirectory() as out:
              disk = fio_benchmark(settings, Path(out))
          print("\n".join(summarize("disk", disk)))
          assert disk["pass"], disk
          EOF
      - name: Check ACR login secrets
        if: github.event_name != 'pull_request'
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          : "${ACR_USERNAME:?Add repository secret ACR_USERNAME (docker login --username)}"
          : "${ACR_PASSWORD:?Add repository secret ACR_PASSWORD (ACR access credential password)}"
      - name: Log in to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Push tested image to ACR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          push: true
          # ACR personal edition rejects OCI attestation manifests
          # (application/vnd.oci.empty.v1+json), so push a plain image manifest.
          provenance: false
          sbom: false
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
