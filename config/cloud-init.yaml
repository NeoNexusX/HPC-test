# Use this as a template for E-HPC node initialization. Replace the registry
# and image names; never put passwords or long-lived AccessKeys in this file.
#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - jq
  - python3
  - fio
runcmd:
  - [ bash, -lc, "mkdir -p /opt/epc-insta-test /shared/results" ]
  - [ bash, -lc, "mkdir -p /mnt/epc-insta-fio" ]
  - [ bash, -lc, "test -x /usr/bin/docker && systemctl enable --now docker || true" ]
  - [ bash, -lc, "echo ready > /opt/epc-insta-test/node-ready" ]
